<title>VR 밸류리밸런싱 트래커</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --muted: #8A8F98;
    --bg: #EDEFE9;
    --panel: #FFFFFF;
    --panel-2: #F5F6F1;
    --line: #DCDFD5;
    --accent: #A9782F;
    --accent-ink: #6E4E1E;
    --accent-soft: #F1E6D2;
    --buy: #0ca30c;
    --buy-soft: #E4F5E1;
    --sell: #d03b3b;
    --sell-soft: #FBE6E4;
    --hold: #8A8F98;
    --hold-soft: #ECEDE9;
    --s-vr: #2a78d6;
    --s-spy: #eb6834;
    --s-qqq: #1baf7a;
    --cat-4: #eda100;
    --cat-5: #e87ba4;
    --cat-6: #008300;
    --cat-7: #4a3aa7;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --ink: #E8E6DD;
      --ink-soft: #B7BEC9;
      --muted: #8D95A3;
      --bg: #12161D;
      --panel: #1B212B;
      --panel-2: #202834;
      --line: #2B3542;
      --accent: #D8A857;
      --accent-ink: #F3D89B;
      --accent-soft: #33291A;
      --buy: #4FBE93;
      --buy-soft: #163628;
      --sell: #E2684B;
      --sell-soft: #3A2019;
      --hold: #8D95A3;
      --hold-soft: #232A34;
      --s-vr: #3987e5;
      --s-spy: #d95926;
      --s-qqq: #199e70;
      --cat-4: #c98500;
      --cat-5: #d55181;
      --cat-6: #008300;
      --cat-7: #9085e9;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #E8E6DD; --ink-soft: #B7BEC9; --muted: #8D95A3; --bg: #12161D;
    --panel: #1B212B; --panel-2: #202834; --line: #2B3542;
    --accent: #D8A857; --accent-ink: #F3D89B; --accent-soft: #33291A;
    --buy: #4FBE93; --buy-soft: #163628; --sell: #E2684B; --sell-soft: #3A2019;
    --hold: #8D95A3; --hold-soft: #232A34;
    --s-vr: #3987e5; --s-spy: #d95926; --s-qqq: #199e70;
    --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink: #1B2430; --ink-soft: #5B6472; --muted: #8A8F98; --bg: #EDEFE9;
    --panel: #FFFFFF; --panel-2: #F5F6F1; --line: #DCDFD5;
    --accent: #A9782F; --accent-ink: #6E4E1E; --accent-soft: #F1E6D2;
    --buy: #0ca30c; --buy-soft: #E4F5E1; --sell: #d03b3b; --sell-soft: #FBE6E4;
    --hold: #8A8F98; --hold-soft: #ECEDE9;
    --s-vr: #2a78d6; --s-spy: #eb6834; --s-qqq: #1baf7a;
    --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }
  h1, h2, h3 { font-family: Georgia, "Iowan Old Style", "Noto Serif KR", serif; text-wrap: balance; margin: 0; }
  .num { font-family: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }

  .mobile-topbar { display: none; }
  .sidebar-backdrop { display: none; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .mobile-topbar {
      display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30;
      background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 14px;
    }
    .mobile-topbar h1 { font-size: 17px; flex: 1; }
    .hamburger-btn {
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel-2); cursor: pointer; padding: 0; align-items: center;
    }
    .hamburger-btn span { display: block; width: 16px; height: 2px; background: var(--ink); border-radius: 2px; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: 82vw; max-width: 320px;
      z-index: 45; transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: var(--shadow); overflow-y: auto;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop {
      display: block; position: fixed; inset: 0; background: rgba(10,12,16,.4);
      z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
    .main { padding: 16px 14px 48px !important; }
    .card { padding: 14px 15px !important; }
    .detail-head h2 { font-size: 21px !important; }
    .form-grid { grid-template-columns: 1fr !important; }
    .stat-strip { grid-template-columns: repeat(2, 1fr) !important; }

    /* Wide data tables become a vertical list of label:value cards instead
       of something you have to swipe sideways to read. Desktop keeps the
       normal table layout untouched — this only kicks in under 860px. */
    table.stack-mobile { border: none; width: 100%; }
    table.stack-mobile thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    table.stack-mobile, table.stack-mobile tbody { display: block; }
    table.stack-mobile tr {
      display: block; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; margin-bottom: 8px; background: var(--panel-2);
    }
    table.stack-mobile tr:last-child { margin-bottom: 0; }
    table.stack-mobile td {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border: none; padding: 4px 0; text-align: right; white-space: normal;
    }
    table.stack-mobile td.num, table.stack-mobile th.num { text-align: right; }
    table.stack-mobile td::before {
      content: attr(data-label); color: var(--muted); font-size: 11px; font-weight: 600;
      text-align: left; flex: 0 0 auto;
    }
    table.stack-mobile td:empty, table.stack-mobile td[data-label=""] { display: none; }
    table.stack-mobile .cell-input { width: auto; max-width: 130px; }
  }

  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .brand h1 { font-size: 20px; }
  .brand .tag { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .theme-toggle {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-soft);
    border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent-ink); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink); padding: 9px 13px; cursor: pointer; font-size: 13.5px;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--panel-2); color: var(--ink); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }
  .btn-danger { color: var(--sell); }

  .instance-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
  .instance-card {
    text-align: left; border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 12px; padding: 12px 13px; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
  }
  .instance-card:hover { border-color: var(--accent); }
  .instance-card.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: var(--shadow); }
  .instance-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .instance-card .iname { font-weight: 650; font-size: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 650;
    padding: 2px 8px; border-radius: 99px; white-space: nowrap;
  }
  .chip-accum { background: var(--buy-soft); color: var(--buy); }
  .chip-lump { background: var(--hold-soft); color: var(--ink-soft); }
  .chip-withdraw { background: var(--sell-soft); color: var(--sell); }
  .instance-card .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .progress-track { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); }

  .sidebar-foot { display: flex; gap: 8px; }

  .main { padding: 26px 30px 60px; max-width: 1180px; }
  .empty-state { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 60px 10px; max-width: 480px; }
  .empty-state h2 { font-size: 24px; }
  .empty-state p { color: var(--ink-soft); }

  .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .detail-head h2 { font-size: 26px; }
  .detail-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .stat-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
  @media (max-width: 980px) { .stat-strip { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .stat-strip { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .stat .label { font-size: 11px; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
  .stat .value { font-size: 18px; font-weight: 650; }
  .stat .value.small { font-size: 15px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .card h3 { font-size: 16px; margin-bottom: 4px; }
  .card .card-desc { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }

  .signal-badge {
    display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px;
    padding: 4px 11px; border-radius: 99px;
  }
  .signal-buy { background: var(--buy-soft); color: var(--buy); }
  .signal-sell { background: var(--sell-soft); color: var(--sell); }
  .signal-hold { background: var(--hold-soft); color: var(--ink-soft); }
  .signal-badge .dot { width: 7px; height: 7px; border-radius: 99px; background: currentColor; }

  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 760px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .field .hint { font-size: 10.5px; color: var(--muted); font-weight: 400; }
  .field input, .field select {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
    border-radius: 8px; padding: 8px 10px; font-size: 13.5px;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  .preview-band {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px;
    background: var(--panel-2); border: 1px dashed var(--line); font-size: 13px; margin-top: 14px;
    flex-wrap: wrap;
  }
  .preview-band b { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
  .table-wrap { overflow-x: auto; }
  th, td { text-align: right; padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; position: sticky; top: 0; background: var(--panel); }
  tbody tr:hover { background: var(--panel-2); }
  td.num, th.num { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--ink-soft); }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 14px; height: 3px; border-radius: 2px; }
  .legend .swatch.area { width: 14px; height: 10px; border-radius: 2px; opacity: .5; }
  .legend .swatch.dot { width: 8px; height: 8px; border-radius: 99px; }

  .chart-wrap { position: relative; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--ink); color: var(--bg);
    padding: 7px 10px; border-radius: 8px; font-size: 11.5px; line-height: 1.5;
    transform: translate(-50%, -110%); white-space: nowrap; box-shadow: var(--shadow); opacity: 0;
    transition: opacity .1s; z-index: 5;
  }
  :root[data-theme="dark"] .chart-tooltip, @media (prefers-color-scheme:dark) { }
  .chart-tooltip b { font-family: ui-monospace, monospace; }
  .chart-empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }

  .transition-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .transition-grid { grid-template-columns: 1fr; } }
  .metric-box { background: var(--panel-2); border-radius: 10px; padding: 13px 15px; }
  .metric-box .m-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .metric-box .m-value { font-size: 21px; font-weight: 700; }
  .metric-box .m-note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .withdraw-check-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
  .withdraw-check-row .field { flex: 1; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 12, 16, .45); display: flex;
    align-items: center; justify-content: center; z-index: 40; padding: 20px;
  }
  .modal {
    background: var(--panel); border-radius: 16px; padding: 24px 26px; width: 100%; max-width: 480px;
    box-shadow: var(--shadow); max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { font-size: 18px; margin-bottom: 16px; }
  .modal .form-grid { grid-template-columns: 1fr 1fr; }
  .hidden { display: none !important; }

  .type-switch-options { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 16px; }
  .type-opt {
    display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 13px; cursor: pointer; background: var(--panel-2);
  }
  .type-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .type-opt input { accent-color: var(--accent); }

  .footnote { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .kbd-hint { font-size: 11px; color: var(--muted); }

  .auth-gate {
    position: fixed; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .auth-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 26px; width: 100%; max-width: 360px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .auth-box h1 { font-size: 22px; }
  .auth-box .tag { font-size: 12.5px; color: var(--muted); }
  .auth-tabs { display: flex; gap: 6px; background: var(--panel-2); border-radius: 9px; padding: 3px; }
  .auth-tab {
    flex: 1; border: none; background: transparent; color: var(--ink-soft); padding: 7px 0;
    border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .auth-tab.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .auth-msg { font-size: 12.5px; color: var(--ink-soft); min-height: 16px; }
  .user-badge {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11.5px; color: var(--muted); padding: 2px 2px 4px;
  }
  .user-badge .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-badge button { font-size: 11px; color: var(--ink-soft); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }

  .mode-switch, .currency-toggle { display: flex; gap: 4px; background: var(--panel-2); border-radius: 9px; padding: 3px; }
  .mode-switch button, .currency-toggle button {
    border: none; background: transparent; color: var(--ink-soft); padding: 7px 10px;
    border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 600; flex: 1;
  }
  .mode-switch button.active, .currency-toggle button.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .currency-toggle { flex: 0 0 auto; }
  .currency-toggle button { flex: none; padding: 6px 12px; }
  .cell-input {
    width: 90px; text-align: right; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink); border-radius: 6px; padding: 5px 7px; font-size: 12.5px;
  }
  .cell-input.ticker { width: 80px; text-align: left; text-transform: uppercase; }
  .cell-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>

<div class="app hidden" id="appRoot">
  <div class="mobile-topbar">
    <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    <h1>VR 트래커</h1>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebarEl">
    <div class="brand">
      <div>
        <h1>VR 트래커</h1>
        <div class="tag">밸류리밸런싱 사이클 관리</div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">라이트</button>
    </div>

    <div class="user-badge">
      <span class="email" id="userEmail"></span>
      <button type="button" id="logoutBtn">로그아웃</button>
    </div>

    <div class="mode-switch" id="modeSwitch">
      <button type="button" data-mode="vr" class="active">VR</button>
      <button type="button" data-mode="portfolio">포트폴리오</button>
    </div>

    <button class="btn btn-primary btn-block" id="newInstanceBtn" type="button">+ 새 VR 만들기</button>

    <div class="instance-list" id="instanceList"></div>

    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-sm" id="exportBtn" type="button" style="flex:1">백업 내보내기</button>
      <button class="btn btn-ghost btn-sm" id="importBtn" type="button" style="flex:1">불러오기</button>
      <input type="file" id="importFile" accept="application/json" class="hidden" />
    </div>
  </aside>

  <main class="main" id="mainArea"></main>
</div>

<div class="modal-overlay hidden" id="newInstanceModal">
  <div class="modal">
    <h3>새 VR 만들기</h3>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;">
      <div class="field" style="grid-column:1/3;">
        <label>이름</label>
        <input id="ni_name" type="text" placeholder="예: VR 7기 적립식" />
      </div>
      <div class="field">
        <label>운용 방식</label>
        <select id="ni_type">
          <option value="적립식">적립식 (계속 입금)</option>
          <option value="거치식">거치식 (추가입금 없음)</option>
          <option value="인출식">인출식 (정기 인출)</option>
        </select>
      </div>
      <div class="field">
        <label>티커</label>
        <input id="ni_ticker" type="text" value="TQQQ" />
      </div>
      <div class="field">
        <label>시작일</label>
        <input id="ni_date" type="date" />
      </div>
      <div class="field">
        <label>사이클 길이(일)</label>
        <input id="ni_cycledays" type="number" value="14" />
      </div>
      <div class="field">
        <label>시작 V (목표기준값, $)</label>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- auth + state ---------------- */
  var SUPABASE_URL = "https://pnzvidgoedgcvwfueaiu.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_g9dpeyGzjC7dH3gSxOisWA_4Dc6bgxk";
  var STORE_KEY = "vr_tracker_state_v1";
  var state = { instances: [], selectedId: null };
  var currentUserId = null;
  var sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function localKey(userId){ return STORE_KEY + "_" + userId; }

  function saveState(){
    if (!currentUserId) return;
    try { localStorage.setItem(localKey(currentUserId), JSON.stringify(state)); } catch(e){}
    cloudSave(currentUserId, state);
  }

  async function cloudLoad(userId){
    if (!sb) return null;
    try {
      var res = await sb.from("vr_data").select("data").eq("user_id", userId).maybeSingle();
      if (res.error){ console.error("cloud load error", res.error); return null; }
      return res.data ? res.data.data : null;
    } catch(e){ console.error("cloud load failed", e); return null; }
  }
  async function cloudSave(userId, stateObj){
    if (!sb) return;
    try {
      var res = await sb.from("vr_data").upsert({ user_id: userId, data: stateObj, updated_at: new Date().toISOString() });
      if (res.error) console.error("cloud save error", res.error);
    } catch(e){ console.error("cloud save failed", e); }
  }

  function setAuthMsg(msg, isError){
    var el = document.getElementById("authMsg");
    if (!el) return;
    el.textContent = msg || "";
    el.style.color = isError ? "var(--sell)" : "var(--ink-soft)";
  }
  function showAuthGate(){
    document.getElementById("authGate").classList.remove("hidden");
    document.getElementById("appRoot").classList.add("hidden");
  }
  function hideAuthGate(){
    document.getElementById("authGate").classList.add("hidden");
    document.getElementById("appRoot").classList.remove("hidden");
  }

  async function onAuthChange(session){
    if (session && session.user){
      currentUserId = session.user.id;
      document.getElementById("userEmail").textContent = session.user.email || "";
      var cached = null;
      try { cached = localStorage.getItem(localKey(currentUserId)); } catch(e){}
      if (cached){ try { state = JSON.parse(cached); } catch(e){} }
      hideAuthGate();
      render();
      fetchFxRate();

      var cloud = await cloudLoad(currentUserId);
      if (cloud){
        state = cloud;
        try { localStorage.setItem(localKey(currentUserId), JSON.stringify(state)); } catch(e){}
        render();
      } else {
        // brand new account on this browser: offer to migrate any pre-login local data
        var legacy = null;
        try { legacy = localStorage.getItem(STORE_KEY); } catch(e){}
        if (legacy){
          try {
            var legacyState = JSON.parse(legacy);
            if (legacyState && legacyState.instances && legacyState.instances.length){
              if (confirm("이 브라우저에 저장돼 있던 기존 기록이 있어요. 이 계정으로 가져올까요?")){
                state = legacyState;
              }
            }
          } catch(e){}
        }
        saveState();
        render();
      }
    } else {
      currentUserId = null;
      state = { instances: [], selectedId: null };
      showAuthGate();
    }
  }

  function wireAuthUI(){
    var authTab = "login";
    var tabs = document.querySelectorAll(".auth-tab");
    var submitBtn = document.getElementById("authSubmit");
    tabs.forEach(function(btn){
      btn.addEventListener("click", function(){
        tabs.forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        authTab = btn.getAttribute("data-tab");
        submitBtn.textContent = authTab === "login" ? "로그인" : "회원가입";
        setAuthMsg("");
      });
    });
    submitBtn.addEventListener("click", async function(){
      if (!sb){ setAuthMsg("연결에 문제가 있어요. 잠시 후 새로고침해주세요.", true); return; }
      var email = document.getElementById("auth_email").value.trim();
      var password = document.getElementById("auth_password").value;
      if (!email || !password){ setAuthMsg("이메일과 비밀번호를 입력해주세요.", true); return; }
      submitBtn.disabled = true;
      setAuthMsg("처리 중...");
      if (authTab === "signup"){
        var r1 = await sb.auth.signUp({ email: email, password: password });
        submitBtn.disabled = false;
        if (r1.error){ setAuthMsg(r1.error.message, true); return; }
        if (!r1.data.session){ setAuthMsg("가입 완료! 받으신 이메일의 인증 링크를 눌러주세요."); }
      } else {
        var r2 = await sb.auth.signInWithPassword({ email: email, password: password });
        submitBtn.disabled = false;
        if (r2.error){ setAuthMsg(r2.error.message, true); return; }
      }
    });
    document.getElementById("logoutBtn").addEventListener("click", async function(){
      if (sb) await sb.auth.signOut();
    });
  }

  /* ---------------- domain logic ---------------- */
  var TYPE_DEFAULTS = {
    "적립식": { startG: 10, gStepDays: 365, poolBase: 75, poolStepPct: 5, poolStepDays: 182.5, poolFloor: 10 },
    "거치식": { startG: 10, gStepDays: 182.5, poolBase: 75, poolStepPct: 5, poolStepDays: 182.5, poolFloor: 10 },
    "인출식": { startG: 40, gStepDays: 182.5, buyLimitPct: 10 }
  };

  function currentSegment(inst, atDate){
    var d = new Date(atDate).getTime();
    var seg = inst.typeSegments[0];
    for (var i=0;i<inst.typeSegments.length;i++){
      if (new Date(inst.typeSegments[i].startDate).getTime() <= d) seg = inst.typeSegments[i];
    }
    return seg;
  }
  function daysBetween(a,b){ return (new Date(b).getTime() - new Date(a).getTime()) / 86400000; }

  function currentG(inst, atDate){
    var seg = currentSegment(inst, atDate);
    var def = TYPE_DEFAULTS[seg.type];
    var days = Math.max(0, daysBetween(seg.startDate, atDate));
    var steps = Math.floor(days / def.gStepDays);
    return seg.startG + steps;
  }

  // Verification aid: when will G next tick up, and to what value.
  function nextGIncrease(inst, atDate){
    var seg = currentSegment(inst, atDate);
    var def = TYPE_DEFAULTS[seg.type];
    var days = Math.max(0, daysBetween(seg.startDate, atDate));
    var steps = Math.floor(days / def.gStepDays);
    var nextStepDays = (steps + 1) * def.gStepDays;
    var d = new Date(new Date(seg.startDate).getTime() + nextStepDays*86400000);
    return { date: d, nextG: seg.startG + steps + 1 };
  }

  // The Pool buy-limit ratio is user-editable (both at creation and later),
  // so this is only the fallback shown/pre-filled when an instance hasn't
  // customized it yet.
  function defaultPoolLimitConfig(type){
    if (type === "인출식") return { mode: "fixed", fixedPct: 10, basePct: 75, stepPct: 5, stepDays: 182.5, floorPct: 10 };
    return { mode: "schedule", basePct: 75, stepPct: 5, stepDays: 182.5, floorPct: 10, fixedPct: 10 };
  }

  function currentPoolLimit(inst, atDate){
    var seg = currentSegment(inst, atDate);
    var cfg = inst.poolLimitConfig || defaultPoolLimitConfig(seg.type);
    if (cfg.mode === "fixed"){
      return { buyPct: cfg.fixedPct, sellPct: null };
    }
    var days = Math.max(0, daysBetween(seg.startDate, atDate));
    var steps = Math.floor(days / cfg.stepDays);
    var pct = Math.max(cfg.floorPct, cfg.basePct - steps*cfg.stepPct);
    return { buyPct: pct, sellPct: null };
  }

  // A cycle can contain zero or more fills ({type:"buy"|"sell", qty, price}) —
  // e.g. several ladder rungs filled at different prices, or a buy and a sell
  // in the same check-in. Each fill's own price drives the cash math exactly
  // (no more approximating the whole cycle's cash flow with one price), while
  // `closePrice` alone values the resulting position for E.
  function computeCycle(inst, prevCycleOrInit, input){
    // input: {date, closePrice, fills:[{type,qty,price}], deposit, spy, qqq}
    var Vprev = prevCycleOrInit.Vnext;
    var Poolprev = prevCycleOrInit.Pool;
    var Qprev = prevCycleOrInit.qty;
    var G = currentG(inst, input.date);
    var fills = input.fills || [];
    var buyQty = 0, buyCost = 0, sellQty = 0, sellProceeds = 0;
    fills.forEach(function(f){
      if (f.type === "buy"){ buyQty += f.qty; buyCost += f.qty*f.price; }
      else { sellQty += f.qty; sellProceeds += f.qty*f.price; }
    });
    var deltaQty = buyQty - sellQty;
    var tradeCash = sellProceeds - buyCost;
    var qtyEnd = Qprev + deltaQty;
    var E = round2(qtyEnd * input.closePrice);
    var raw = Vprev + (Poolprev / G) + ((E - Vprev) / (2 * Math.sqrt(G)));
    var Vnext = round2(raw) + Number(input.deposit || 0);
    var Pool = round2(Poolprev + Number(input.deposit || 0) + tradeCash);
    var band = inst.band || {low:0.85, high:1.15};
    var buyBandPrev = round2(Vprev * band.low);
    var sellBandPrev = round2(Vprev * band.high);
    var signal = "hold";
    if (E <= buyBandPrev) signal = "buy";
    else if (E >= sellBandPrev) signal = "sell";
    var limit = currentPoolLimit(inst, input.date);
    var buyBandNext = round2(Vnext * band.low);
    var sellBandNext = round2(Vnext * band.high);
    var buyLimitAmt = round2(Pool * (limit.buyPct/100));
    return {
      id: uid(), date: input.date, price: input.closePrice, qty: qtyEnd, E: E,
      fills: fills.map(function(f){ return { type: f.type, qty: f.qty, price: f.price }; }),
      deposit: Number(input.deposit||0), G: G, Vprev: Vprev, Vnext: Vnext,
      Pool: Pool, PoolPrev: Poolprev, deltaQty: deltaQty, tradeCash: tradeCash,
      buyBandPrev: buyBandPrev, sellBandPrev: sellBandPrev, signal: signal,
      buyBandNext: buyBandNext, sellBandNext: sellBandNext,
      poolLimitPct: limit.buyPct, buyLimitAmt: buyLimitAmt,
      spy: (input.spy !== "" && input.spy != null) ? Number(input.spy) : null,
      qqq: (input.qqq !== "" && input.qqq != null) ? Number(input.qqq) : null
    };
  }

  function round2(n){ return Math.round(n*100)/100; }
  function fmtMoney(n){
    if (n == null || isNaN(n)) return "–";
    var sign = n < 0 ? "-" : "";
    n = Math.abs(n);
    return sign + "$" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtMoney0(n){
    if (n == null || isNaN(n)) return "–";
    return (n<0?"-":"") + "$" + Math.abs(Math.round(n)).toLocaleString("en-US");
  }
  function fmtPct(n, d){
    if (n == null || isNaN(n)) return "–";
    return n.toFixed(d==null?1:d) + "%";
  }
  function fmtDate(d){
    var dt = new Date(d);
    return (dt.getMonth()+1) + "/" + dt.getDate() + "/" + String(dt.getFullYear()).slice(2);
  }
  function typeChip(type){
    var cls = type === "적립식" ? "chip-accum" : (type === "거치식" ? "chip-lump" : "chip-withdraw");
    return '<span class="chip ' + cls + '">' + type + '</span>';
  }

  function instanceInitPseudoCycle(inst){
    return { Vnext: inst.initV, Pool: inst.initPool, qty: inst.initQty, E: round2((inst.initQty||0) * (inst.initPrice||0)) };
  }
  function lastState(inst){
    if (inst.cycles.length === 0) return instanceInitPseudoCycle(inst);
    return inst.cycles[inst.cycles.length-1];
  }
  function totalValue(cycleOrInit){
    return (cycleOrInit.E != null ? cycleOrInit.E : (cycleOrInit.qty||0)) + (cycleOrInit.Pool||0);
  }

  // Reference-only running weighted-average cost, derived purely from recorded
  // cycle fills. Not used anywhere in the VR formula itself (V/Pool/G/E don't
  // need it) — it's just for showing an approximate profit/return alongside.
  // Cycles recorded before multi-fill support only have a single net
  // deltaQty/price — synthesize an equivalent single fill so old data still
  // walks through computeEffectiveCostBasis the same way.
  function legacyFillsFromCycle(c){
    var dq = c.deltaQty || 0;
    if (!dq) return [];
    return [{ type: dq > 0 ? "buy" : "sell", qty: Math.abs(dq), price: c.price }];
  }
  function computeEffectiveCostBasis(inst){
    var qty = inst.initQty || 0;
    var cost = qty * (inst.initPrice || 0);
    var realizedPL = 0;
    inst.cycles.forEach(function(c){
      var fills = (c.fills && c.fills.length) ? c.fills : legacyFillsFromCycle(c);
      fills.forEach(function(f){
        if (f.type === "buy"){
          cost += f.qty * f.price;
          qty += f.qty;
        } else if (qty > 0){
          var avg = cost / qty;
          var sellQty = Math.min(f.qty, qty);
          realizedPL += sellQty * (f.price - avg);
          qty -= sellQty;
          cost = avg * Math.max(0, qty);
        }
      });
    });
    return { qty: qty, avgCost: qty > 0 ? cost/qty : 0, realizedPL: realizedPL };
  }

  function normalizeState(){
    if (!state.instances) state.instances = [];
    if (state.selectedId === undefined) state.selectedId = null;
    if (!state.viewMode) state.viewMode = "vr";
    if (!state.portfolioCurrency) state.portfolioCurrency = "USD";
    if (!state.portfolio) state.portfolio = { holdings: [] };
    if (!state.portfolio.holdings) state.portfolio.holdings = [];
    if (state.portfolio.extraCash == null) state.portfolio.extraCash = 0;
    if (!state.portfolio.cashLog) state.portfolio.cashLog = [];
    state.portfolio.holdings.forEach(function(h){
      if (h.realizedPL == null) h.realizedPL = 0;
      if (!h.trades) h.trades = [];
    });
  }

  function pushCashLog(kind, amount, date, note){
    state.portfolio.cashLog.push({ id: uid(), date: date, kind: kind, amount: amount, note: note || "" });
    state.portfolio.cashLog.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
  }

  function aggregateVrHoldingsByTicker(){
    var map = {};
    state.instances.forEach(function(inst){
      var last = lastState(inst);
      var qty = last.qty || 0;
      if (qty <= 0) return;
      var value = last.E != null ? last.E : qty * (inst.initPrice||0);
      var t = (inst.ticker || "?").toUpperCase();
      if (!map[t]) map[t] = { ticker: t, qty: 0, value: 0, investedReal: 0, qtyWithReal: 0 };
      map[t].qty += qty;
      map[t].value += value;
      if (inst.realAvgCost != null){
        map[t].investedReal += qty * inst.realAvgCost;
        map[t].qtyWithReal += qty;
      }
    });
    return Object.keys(map).sort().map(function(t){ return map[t]; });
  }

  async function fetchFxRate(force){
    if (!force && state.fx && state.fx.updatedAt && (Date.now() - new Date(state.fx.updatedAt).getTime()) < 30*60*1000) return;
    try {
      var res = await fetch("https://open.er-api.com/v6/latest/USD");
      var json = await res.json();
      if (json && json.rates && json.rates.KRW){
        state.fx = { usdkrw: json.rates.KRW, updatedAt: new Date().toISOString() };
        saveState();
        if (state.viewMode === "portfolio") renderMain();
      }
    } catch(e){ console.error("fx fetch failed", e); }
  }

  var TWELVEDATA_KEY = "9d7a1fad48604a07874cb77f737f3557";
  var LIVE_PRICE_CACHE = {};
  var LIVE_PRICE_TTL_MS = 5*60*1000;

  function getLivePrice(ticker){
    var c = LIVE_PRICE_CACHE[ticker];
    return c ? c.price : null;
  }

  async function fetchLivePrices(tickers){
    var now = Date.now();
    var uniq = [];
    tickers.forEach(function(t){ if (t && uniq.indexOf(t)===-1) uniq.push(t); });
    var need = uniq.filter(function(t){
      var c = LIVE_PRICE_CACHE[t];
      return !c || (now - c.ts) > LIVE_PRICE_TTL_MS;
    });
    if (!need.length) return false;
    var changed = false;
    // Always stamp every requested ticker with "ts: now" below, success or
    // failure — that's what stops a failed call (rate limit, bad symbol,
    // network hiccup) from being retried on every single render. Previously
    // a failed fetch left the ticker uncached, so the next render saw it as
    // still "needed", fetched again, failed again, forever — this is what
    // burned through the whole day's API quota in one sitting.
    function markFailed(t){
      var prev = LIVE_PRICE_CACHE[t];
      LIVE_PRICE_CACHE[t] = { price: prev ? prev.price : null, ts: now, failed: true };
    }
    try {
      var url = "https://api.twelvedata.com/price?symbol=" + encodeURIComponent(need.join(",")) + "&apikey=" + TWELVEDATA_KEY;
      var res = await fetch(url);
      var json = await res.json();
      if (need.length === 1){
        if (json && json.price && !isNaN(parseFloat(json.price))){
          LIVE_PRICE_CACHE[need[0]] = { price: parseFloat(json.price), ts: now };
          changed = true;
        } else {
          markFailed(need[0]);
        }
      } else {
        need.forEach(function(t){
          var entry = json[t];
          if (entry && entry.price && !isNaN(parseFloat(entry.price))){
            LIVE_PRICE_CACHE[t] = { price: parseFloat(entry.price), ts: now };
            changed = true;
          } else {
            markFailed(t);
          }
        });
      }
    } catch(e){
      console.error("live price fetch failed", e);
      need.forEach(markFailed);
    }
    return changed;
  }

    if (state.portfolioCurrency === "KRW" && state.fx && state.fx.usdkrw){

      return (krw<0?"-":"") + "₩" + Math.abs(Math.round(krw)).toLocaleString("ko-KR");
    }
    return fmtMoney0(usdAmount);
  }

      var res = computeCycle(inst, last, {date:date, closePrice:close, fills:fills, deposit:dep, spy:spyEl.value, qqq:qqqEl.value});
      inst.cycles.push(res);
      inst.cycles.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
      saveState();
      render();
    });
  }

  var ALLOC_CATEGORICAL = ["var(--s-vr)", "var(--s-spy)", "var(--s-qqq)", "var(--cat-4)", "var(--cat-5)", "var(--cat-6)", "var(--cat-7)"];

  // slices: [{label, value, isCash?}] — color is assigned by fixed order
  // (categorical hues for tickers, a dedicated color for cash, muted for
  // "기타"), never by rank, so a slice's color doesn't jump around as
  // amounts change between renders.
  function renderAllocationDonut(slices){
    var total = slices.reduce(function(s,x){ return s + x.value; }, 0);
    if (total <= 0){
      return '<div class="chart-empty">아직 자산이 없어요. VR을 만들면 여기 채워져요.</div>';
    }
    var r = 70, cx = 90, cy = 90, sw = 26;
    var circumference = 2 * Math.PI * r;
    var catIdx = 0;
    var colored = slices.map(function(s){
      var color;
      if (s.isCash) color = "var(--accent)";
      else if (s.label === "기타") color = "var(--muted)";
      else { color = ALLOC_CATEGORICAL[catIdx % ALLOC_CATEGORICAL.length]; catIdx++; }
      return { label: s.label, value: s.value, pct: s.value/total*100, color: color };
    });

    var cumLen = 0;
    var arcs = colored.map(function(s){
      var len = circumference * (s.value/total);
      var arc = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="' + sw + '" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + circumference.toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-cumLen).toFixed(2) + '" ' +
        'transform="rotate(-90 ' + cx + ' ' + cy + ')" />';
      cumLen += len;
      return arc;
    }).join("");

    var topLabel = colored.length ? (colored[0].label + " " + colored[0].pct.toFixed(0) + "%") : "";
    var svg =
      '<svg viewBox="0 0 180 180" width="180" height="180" style="flex:0 0 auto;">' + arcs +
        '<text x="' + cx + '" y="' + (cy-16) + '" text-anchor="middle" font-size="12" fill="var(--muted)">총자산</text>' +
        '<text x="' + cx + '" y="' + (cy+2) + '" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink)">' + fmtCurrency(total) + '</text>' +
        '<text x="' + cx + '" y="' + (cy+20) + '" text-anchor="middle" font-size="12" fill="var(--muted)">' + escapeHtml(topLabel) + '</text>' +
      '</svg>';

    var legend = '<div style="display:flex;flex-direction:column;gap:8px;justify-content:center;">' +
      colored.map(function(s){
        return '<div class="legend" style="margin:0;"><span class="item"><span class="swatch" style="background:' + s.color + ';width:10px;height:10px;border-radius:99px;"></span>' +
          escapeHtml(s.label) + ' &nbsp;<b class="num">' + fmtCurrency(s.value) + '</b> &nbsp;(' + s.pct.toFixed(1) + '%)</span></div>';
      }).join("") +
    '</div>';
    return '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">' + svg + legend + '</div>';
  }

  function renderVrHoldingsTable(vrHoldings){
    if (!vrHoldings.length) return '<div class="chart-empty">아직 VR에 보유수량이 없어요.</div>';
    var anyPartial = false;
    var rows = vrHoldings.map(function(h){
      var live = getLivePrice(h.ticker);
      var fallbackAvg = h.qty ? h.value/h.qty : 0;
      var price = live != null ? live : fallbackAvg;
      var value = h.qty * price;
      var priceLabel = fmtCurrency(price) + (live != null ? ' <span class="footnote" style="display:inline;">실시간</span>' : ' <span class="footnote" style="display:inline;">마지막 사이클 기준</span>');
      var profitCell = '<span class="footnote">실제평단 미입력</span>';
      if (h.qtyWithReal > 0){
        var realValue = h.qtyWithReal * price;
        var profit = realValue - h.investedReal;
        var pct = h.investedReal > 0 ? (profit/h.investedReal*100) : null;
        var color = profit > 0 ? "var(--buy)" : (profit < 0 ? "var(--sell)" : "var(--ink-soft)");
        var partial = h.qtyWithReal < h.qty;
        if (partial) anyPartial = true;
        profitCell = '<span style="color:' + color + '">' + fmtCurrency(profit) + (pct!=null?(' ('+fmtPct(pct,1)+')'):'') + '</span>' +
          (partial ? ' <span class="footnote" style="display:inline;">*일부물량</span>' : '');
      }
      return '<tr><td data-label="티커">' + escapeHtml(h.ticker) + '</td><td class="num" data-label="수량">' + h.qty +
        '</td><td class="num" data-label="현재가">' + priceLabel + '</td><td class="num" data-label="평가금">' + fmtCurrency(value) + '</td>' +
        '<td class="num" data-label="손익(실제평단)">' + profitCell + '</td></tr>';
    }).join("");
    return '<div class="table-wrap"><table class="stack-mobile"><thead><tr><th>티커</th><th class="num">수량</th>' +
      '<th class="num">현재가</th><th class="num">평가금</th><th class="num">손익(실제평단 기준)</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (anyPartial ? '<div class="footnote" style="margin-top:6px;">*일부물량: 같은 티커의 VR 중 실제평단을 입력 안 한 게 있어서, 입력된 수량만큼만 계산했어요.</div>' : '');
  }

    }).join("");
    host.innerHTML = '<div class="table-wrap"><table class="stack-mobile"><thead><tr>' +
      '<th>티커</th><th class="num">수량</th><th class="num">매입평균가</th><th class="num">현재가</th>' +
      '<th class="num">평가금</th><th class="num">미실현 수익금</th><th class="num">미실현 수익률</th><th class="num">실현손익</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';

    Array.prototype.forEach.call(host.querySelectorAll("tbody tr"), function(tr){
      var id = tr.getAttribute("data-id");
      var h = holdings.find(function(x){ return x.id === id; });
      function commit(){ saveState(); renderMain(); }
      tr.querySelector(".h-ticker").addEventListener("change", function(){ h.ticker = this.value.trim().toUpperCase(); commit(); });
      tr.querySelector(".h-qty").addEventListener("change", function(){ h.qty = parseFloat(this.value)||0; commit(); });
      tr.querySelector(".h-cost").addEventListener("change", function(){ h.avgCost = parseFloat(this.value)||0; commit(); });
      var priceInput = tr.querySelector(".h-price");
      if (priceInput){
        priceInput.addEventListener("change", function(){ h.currentPrice = parseFloat(this.value)||0; commit(); });
      }
      tr.querySelector(".h-del").addEventListener("click", function(){
        state.portfolio.holdings = state.portfolio.holdings.filter(function(x){ return x.id !== id; });

  function wireWithdrawCalc(tot){

  var DEFAULT_TRANCHE_SIZE = 1; // base unit is always "1개씩" — the account owner personally scales it (e.g. "2배", "5배") to fit their own capital size, so this is a per-VR setting, not a derivable formula

  // Reproduces the real 중계표 mechanic: each rung's price is the band dollar
  // amount divided by the share count held BEFORE that rung (buyBand/q or
  // sellBand/q) — not linear interpolation across a price range. Since q
  // grows (buy) or shrinks (sell) by trancheSize each rung, the trigger
  // price naturally steps away from the band on its own; the ladder starts
  // exactly AT the band price and extends further in the adverse direction.
  // `canAfford(cumulativeQty, cost)` decides whether to include the next
  // rung; returning false stops the ladder there.
  function buildBandLadder(startQty, bandDollar, direction, trancheSize, canAfford){
    var tranches = [];
    var q = startQty;
    var spent = 0;
    for (var i=0; i<2000; i++){
      if (direction < 0 && q - trancheSize < 0) break;
      var price = bandDollar / q;
      var cost = trancheSize * price;
      if (!canAfford(tranches.length * trancheSize + trancheSize, spent + cost)) break;
      tranches.push({ price: round2(price), qty: trancheSize });
      spent += cost;
      q += direction * trancheSize;
    }
    return tranches;
  }

  function renderOrderTable(inst, last, buyBand, sellBand, limit){
    var qty = last.qty || 0;
    var V = last.Vnext;
    var buyLimitAmt = round2(last.Pool * (limit.buyPct/100));
    var trancheSize = inst.trancheSize || DEFAULT_TRANCHE_SIZE;
    var buyTranches = [], sellTranches = [], note = "";

    if (qty > 0){
      var buyPriceInit = buyBand / qty;
      var sellPriceInit = sellBand / qty;
      // Don't buy past the point where E would already be restored to V,
      // even if the pool limit would allow more.
      var maxBuyQty = Math.floor(Math.max(0, (V - buyBand) / buyPriceInit));
      buyTranches = buildBandLadder(qty, buyBand, +1, trancheSize, function(cumQty, cumSpent){
        return cumQty <= maxBuyQty && cumSpent <= buyLimitAmt;
      });
      var boughtQty = buyTranches.length * trancheSize;
      if (boughtQty < maxBuyQty) note = '매수 한도(' + limit.buyPct.toFixed(0) + '%, ' + fmtMoney0(buyLimitAmt) + ')에 걸려서 필요한 수량보다 적게 매수돼요.';

      // Sell has no pool-based limit — only stop once E would be restored to V.
      var maxSellQty = Math.floor(Math.min(Math.max(0, (sellBand - V) / sellPriceInit), qty));
      sellTranches = buildBandLadder(qty, sellBand, -1, trancheSize, function(cumQty){
        return cumQty <= maxSellQty;
      });
    } else {
      var refPrice = inst.initPrice || (inst.cycles.length ? inst.cycles[inst.cycles.length-1].price : 0);
      if (refPrice > 0){
        var affordableQty = Math.floor(buyLimitAmt/refPrice);
        if (affordableQty > 0) buyTranches = [{ price: round2(refPrice), qty: affordableQty }];
        note = '보유수량 0 — 이번엔 가격 상관없이 무조건 매수예요.';
      }
    }

    function trancheRows(type, tranches){
      if (!tranches.length) return '<tr><td colspan="4" class="chart-empty">해당 없음</td></tr>';
      var cls = type === "매수" ? "signal-buy" : "signal-sell";
      return tranches.map(function(t, i){
        return '<tr>' +
          '<td data-label="구분">' + (i===0 ? '<span class="signal-badge ' + cls + '" style="padding:2px 8px;font-size:11px;"><span class="dot"></span>' + type + ' ' + (i+1) + '/' + tranches.length + '</span>' : '<span class="footnote">' + type + ' ' + (i+1) + '/' + tranches.length + '</span>') + '</td>' +
          '<td class="num" data-label="가격" style="text-align:right;">' + fmtMoney(t.price) + '</td>' +
          '<td class="num" data-label="수량" style="text-align:right;">' + t.qty.toLocaleString() + '주</td>' +
          '<td class="num" data-label="금액" style="text-align:right;">' + fmtMoney0(t.qty*t.price) + '</td>' +
          '</tr>';
      }).join("");
    }

    return '<div class="table-wrap"><table class="stack-mobile"><thead><tr>' +
      '<th>구분</th><th class="num">가격</th><th class="num">수량</th><th class="num">금액</th>' +
      '</tr></thead><tbody>' + trancheRows("매수", buyTranches) + trancheRows("매도", sellTranches) + '</tbody></table></div>' +
      (note ? ('<div class="footnote" style="margin-top:8px;">' + note + '</div>') : '');
  }

  function renderHistoryTable(inst){
    if (inst.cycles.length === 0){
      return '<div class="chart-empty">아직 기록된 사이클이 없어요. 위에서 첫 사이클을 입력해보세요.</div>';

      var fills = c.fills || [];

      var sellN = fills.filter(function(f){ return f.type==="sell"; }).length;
      var fillsTxt = fills.length
        ? [buyN ? ("매수 " + buyN + "건") : null, sellN ? ("매도 " + sellN + "건") : null].filter(Boolean).join(" · ")
        : "–";
      return '<tr>' +
        '<td data-label="날짜">' + fmtDate(c.date) + '</td>' +
        '<td data-label="신호"><span class="signal-badge ' + sigCls + '" style="padding:2px 8px;font-size:11px;"><span class="dot"></span>' + sigTxt + '</span></td>' +
        '<td data-label="체결내역">' + fillsTxt + '</td>' +
        '<td class="num" data-label="종가">' + fmtMoney(c.price) + '</td>' +

    return '<div class="table-wrap"><table class="stack-mobile"><thead><tr>' +
      '<th>날짜</th><th>신호</th><th>체결내역</th><th class="num">종가</th><th class="num">수량</th><th class="num">평가금 E</th>' +
      '<th class="num">적립/인출</th><th class="num">G</th><th class="num">V</th><th class="num">다음매수↓</th><th class="num">다음매도↑</th><th class="num">Pool</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';

  /* ---------------- charts (hand-rolled SVG) ---------------- */
  function svgEl(tag, attrs){
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // Hover doesn't exist on touch devices, so chart tooltips need an explicit
  // tap handler too — this wires both to the same show/hide callbacks,
  // normalizing touch events to look like a mouse event (clientX/clientY).
  function bindPointerTip(el, onShow, onHide){
    el.addEventListener("mousemove", onShow);
    el.addEventListener("mouseleave", onHide);
    el.addEventListener("touchstart", function(ev){
      ev.preventDefault();
      var t = ev.touches[0];
      onShow({ clientX: t.clientX, clientY: t.clientY });
    }, { passive: false });
    el.addEventListener("touchmove", function(ev){
      ev.preventDefault();
      var t = ev.touches[0];
      onShow({ clientX: t.clientX, clientY: t.clientY });
    }, { passive: false });
    el.addEventListener("touchend", onHide);
  }

  function renderBandChart(host, inst){
    host.innerHTML = "";
    var points = inst.cycles;
    if (points.length === 0){
      host.innerHTML = '<div class="chart-empty">사이클을 입력하면 그래프가 나타나요.</div>';
      return;
    }
    var legend = document.createElement("div");
    legend.className = "legend";
    legend.innerHTML =
      '<span class="item"><span class="swatch area" style="background:' + cssVar('--muted') + '"></span>매수~매도 밴드</span>' +
      '<span class="item"><span class="swatch" style="background:' + cssVar('--ink-soft') + '"></span>V (기준값)</span>' +
      '<span class="item"><span class="swatch" style="background:' + cssVar('--s-vr') + '"></span>평가금 E</span>' +
      '<span class="item"><span class="swatch dot" style="background:' + cssVar('--buy') + '"></span>매수 체결</span>' +
      '<span class="item"><span class="swatch dot" style="background:' + cssVar('--sell') + '"></span>매도 체결</span>';
    host.appendChild(legend);

    var W = host.clientWidth || 900, H = 300, pad = {l:56,r:16,t:14,b:28};
    var wrap = document.createElement("div"); wrap.className = "chart-wrap";
    var svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:"100%", height:H, style:"display:block;overflow:visible;"});
    wrap.appendChild(svg);
    var tooltip = document.createElement("div"); tooltip.className = "chart-tooltip"; wrap.appendChild(tooltip);
    host.appendChild(wrap);

    var dates = points.map(function(p){ return new Date(p.date).getTime(); });
    var todayMs = new Date(todayStr()).getTime();
    var minD = Math.min.apply(null, dates), maxD = Math.max(Math.max.apply(null, dates), todayMs);
    if (minD === maxD) maxD = minD + 86400000;
    var vals = [];
    points.forEach(function(p){ vals.push(p.E, p.Vnext, p.buyBandNext, p.sellBandNext); });
    var minV = Math.min.apply(null, vals) * 0.92, maxV = Math.max.apply(null, vals) * 1.06;

    function x(t){ return pad.l + (t-minD)/(maxD-minD) * (W-pad.l-pad.r); }
    function y(v){ return H-pad.b - (v-minV)/(maxV-minV) * (H-pad.t-pad.b); }

    // gridlines
    var gridN = 4;
    for (var i=0;i<=gridN;i++){
      var gv = minV + (maxV-minV)*i/gridN;
      var gy = y(gv);
      svg.appendChild(svgEl("line", {x1:pad.l, x2:W-pad.r, y1:gy, y2:gy, stroke:cssVar('--line'), "stroke-width":1}));
      var lbl = svgEl("text", {x:pad.l-8, y:gy+4, "text-anchor":"end", "font-size":10, fill:cssVar('--muted')});
      lbl.textContent = "$" + Math.round(gv).toLocaleString();
      svg.appendChild(lbl);
    }

    // V and the buy/sell bands are constant from the moment a cycle is
    // recorded until the next one — build a step-after curve (flat segments,
    // vertical jumps) rather than diagonally interpolating between cycles,
    // and extend the last segment out to today so a single cycle still draws
    // a visible band instead of a zero-width point.
    function buildStepPoints(getVal){
      var pts = [];
      points.forEach(function(p){
        var xi = x(new Date(p.date).getTime());
        var yi = y(getVal(p));
        if (pts.length > 0) pts.push([xi, pts[pts.length-1][1]]);
        pts.push([xi, yi]);
      });
      if (todayMs > dates[dates.length-1]){
        pts.push([x(todayMs), pts[pts.length-1][1]]);
      }
      return pts;
    }
    function pointsToPath(pts){
      return pts.map(function(pt,i){ return (i===0?"M":"L") + pt[0] + "," + pt[1]; }).join(" ");
    }
    function pointsToPathReversed(pts){
      return pts.slice().reverse().map(function(pt){ return "L" + pt[0] + "," + pt[1]; }).join(" ");
    }

    var sellPts = buildStepPoints(function(p){ return p.sellBandNext; });
    var buyPts = buildStepPoints(function(p){ return p.buyBandNext; });
    var vPts = buildStepPoints(function(p){ return p.Vnext; });

    svg.appendChild(svgEl("path", {d: pointsToPath(sellPts) + " " + pointsToPathReversed(buyPts) + " Z", fill: cssVar('--muted'), opacity:0.13, stroke:"none"}));
    svg.appendChild(svgEl("path", {d: pointsToPath(vPts), fill:"none", stroke:cssVar('--ink-soft'), "stroke-width":1.5, "stroke-dasharray":"4 3"}));

    function linePath(key){
      return points.map(function(p,i){ return (i===0?"M":"L") + x(new Date(p.date).getTime()) + "," + y(p[key]); }).join(" ");
    }
    svg.appendChild(svgEl("path", {d: linePath("E"), fill:"none", stroke:cssVar('--s-vr'), "stroke-width":2.5, "stroke-linecap":"round", "stroke-linejoin":"round"}));

    points.forEach(function(p){
      var cx = x(new Date(p.date).getTime()), cy = y(p.E);
      var color = p.signal === "buy" ? cssVar('--buy') : (p.signal === "sell" ? cssVar('--sell') : cssVar('--s-vr'));
      var r = p.signal === "hold" ? 3 : 5;
      var c = svgEl("circle", {cx:cx, cy:cy, r:r, fill:color, stroke:cssVar('--panel'), "stroke-width":1.5, style:"cursor:pointer;"});
      bindPointerTip(c, function(ev){ showTip(ev, wrap, tooltip, p); }, function(){ tooltip.style.opacity = 0; });
      svg.appendChild(c);
    });

    function showTip(ev, wrap, tooltip, p){
      var r = wrap.getBoundingClientRect();
      tooltip.style.left = (ev.clientX - r.left) + "px";
      tooltip.style.top = (ev.clientY - r.top) + "px";
      tooltip.style.opacity = 1;
      tooltip.innerHTML = "<b>" + fmtDate(p.date) + "</b><br/>E " + fmtMoney0(p.E) + " · V " + fmtMoney0(p.Vnext) + "<br/>밴드 " + fmtMoney0(p.buyBandNext) + " ~ " + fmtMoney0(p.sellBandNext);
    }
  }

  function renderComparisonChart(host, inst){
    host.innerHTML = "";
    var points = inst.cycles;
    if (points.length === 0){
      host.innerHTML = '<div class="chart-empty">사이클을 입력하면 그래프가 나타나요.</div>';
      return;
    }
    var hasAnyPrice = points.some(function(p){ return p.spy != null || p.qqq != null; });
    var legend = document.createElement("div");
    legend.className = "legend";
    legend.innerHTML =
      '<span class="item"><span class="swatch" style="background:' + cssVar('--s-vr') + '"></span>VR 전략 (평가금+Pool)</span>' +
      '<span class="item"><span class="swatch" style="background:' + cssVar('--s-spy') + '"></span>SPY 적립식 (동일 입금액)</span>' +
      '<span class="item"><span class="swatch" style="background:' + cssVar('--s-qqq') + '"></span>QQQ 적립식 (동일 입금액)</span>';
    host.appendChild(legend);
    if (!hasAnyPrice){
      var warn = document.createElement("div");
      warn.className = "footnote";
      warn.style.marginBottom = "8px";
      warn.textContent = "SPY·QQQ 종가를 사이클 입력에서 넣어주면 이 그래프가 채워져요.";
      host.appendChild(warn);
    }

    // simulate DCA
    var spyShares = 0, qqqShares = 0, lastSpy = null, lastQqq = null;
    var series = points.map(function(p, idx){
      var dep = (idx===0 ? inst.initPool + inst.initQty*(points[0].price||0) : p.deposit);
      // for first point, treat initial lump/qty value as the "principal" moment; subsequent = incremental deposit only
      var depositAmt = idx===0 ? (inst.initPool + (inst.initQty||0)*(p.price||0)) : Math.max(0, p.deposit||0);
      if (p.spy != null) lastSpy = p.spy;
      if (p.qqq != null) lastQqq = p.qqq;
      if (lastSpy) spyShares += depositAmt / lastSpy;
      if (lastQqq) qqqShares += depositAmt / lastQqq;
      var vrTotal = totalValue(p);
      return {
        date: p.date,
        vr: vrTotal,
        spy: lastSpy ? spyShares*lastSpy : null,
        qqq: lastQqq ? qqqShares*lastQqq : null
      };
    });

    var W = host.clientWidth || 900, H = 300, pad = {l:64,r:16,t:14,b:28};
    var wrap = document.createElement("div"); wrap.className = "chart-wrap";
    var svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:"100%", height:H, style:"display:block;overflow:visible;"});
    wrap.appendChild(svg);
    var tooltip = document.createElement("div"); tooltip.className = "chart-tooltip"; wrap.appendChild(tooltip);
    host.appendChild(wrap);

    var dates = series.map(function(p){ return new Date(p.date).getTime(); });
    var minD = Math.min.apply(null, dates), maxD = Math.max.apply(null, dates);
    if (minD === maxD) maxD = minD + 86400000;
    var vals = [0];
    series.forEach(function(p){ vals.push(p.vr); if(p.spy!=null) vals.push(p.spy); if(p.qqq!=null) vals.push(p.qqq); });
    var minV = 0, maxV = Math.max.apply(null, vals) * 1.08 || 100;

    function x(t){ return pad.l + (t-minD)/(maxD-minD) * (W-pad.l-pad.r); }
    function y(v){ return H-pad.b - (v-minV)/(maxV-minV) * (H-pad.t-pad.b); }

    for (var i=0;i<=4;i++){
      var gv = minV + (maxV-minV)*i/4;
      var gy = y(gv);
      svg.appendChild(svgEl("line", {x1:pad.l, x2:W-pad.r, y1:gy, y2:gy, stroke:cssVar('--line'), "stroke-width":1}));
      var lbl = svgEl("text", {x:pad.l-8, y:gy+4, "text-anchor":"end", "font-size":10, fill:cssVar('--muted')});
      lbl.textContent = "$" + Math.round(gv).toLocaleString();
      svg.appendChild(lbl);
    }

    function linePath(key, colorVar){
      var d = "", started = false;
      series.forEach(function(p){
        var v = p[key];
        if (v == null){ started = false; return; }
        var cx = x(new Date(p.date).getTime()), cy = y(v);
        d += (started ? "L" : "M") + cx + "," + cy + " ";
        started = true;
      });
      return d;
    }
    svg.appendChild(svgEl("path", {d: linePath("spy"), fill:"none", stroke:cssVar('--s-spy'), "stroke-width":2, "stroke-linecap":"round"}));
    svg.appendChild(svgEl("path", {d: linePath("qqq"), fill:"none", stroke:cssVar('--s-qqq'), "stroke-width":2, "stroke-linecap":"round"}));
    svg.appendChild(svgEl("path", {d: linePath("vr"), fill:"none", stroke:cssVar('--s-vr'), "stroke-width":2.75, "stroke-linecap":"round"}));

    // endpoint markers + hover targets
    series.forEach(function(p, idx){
      var cx = x(new Date(p.date).getTime());
      var hitW = (W-pad.l-pad.r)/series.length;
      var hitRect = svgEl("rect", {x:cx-hitW/2, y:pad.t, width:hitW, height:H-pad.t-pad.b, fill:"transparent"});
      bindPointerTip(hitRect, function(ev){
        var r = wrap.getBoundingClientRect();
        tooltip.style.left = (ev.clientX - r.left) + "px";
        tooltip.style.top = (ev.clientY - r.top) + "px";
        tooltip.style.opacity = 1;
        tooltip.innerHTML = "<b>" + fmtDate(p.date) + "</b><br/>VR " + fmtMoney0(p.vr) +
          (p.spy!=null ? "<br/>SPY " + fmtMoney0(p.spy) : "") +
          (p.qqq!=null ? "<br/>QQQ " + fmtMoney0(p.qqq) : "");
      }, function(){ tooltip.style.opacity = 0; });
      svg.appendChild(hitRect);
      if (idx === series.length-1){
        [["vr","--s-vr"],["spy","--s-spy"],["qqq","--s-qqq"]].forEach(function(pair){
          var v = p[pair[0]];
          if (v==null) return;
          svg.appendChild(svgEl("circle", {cx:cx, cy:y(v), r:4, fill:cssVar(pair[1])}));
        });
      }
    });
  }

  /* ---------------- modals ---------------- */
  var newModal = document.getElementById("newInstanceModal");
  function applyPoolLimitDefaultsToNiForm(type){
    var cfg = defaultPoolLimitConfig(type);
    document.getElementById("ni_pl_mode").value = cfg.mode;
    document.getElementById("ni_pl_base").value = cfg.basePct;
    document.getElementById("ni_pl_step").value = cfg.stepPct;
    document.getElementById("ni_pl_stepdays").value = cfg.stepDays;
    document.getElementById("ni_pl_floor").value = cfg.floorPct;
    document.getElementById("ni_pl_fixed").value = cfg.fixedPct;
  }
  function openNewInstanceModal(){
    document.getElementById("ni_name").value = "";
    document.getElementById("ni_type").value = "적립식";
    document.getElementById("ni_ticker").value = "TQQQ";
    document.getElementById("ni_date").value = todayStr();
    document.getElementById("ni_cycledays").value = 14;
    document.getElementById("ni_v").value = "";
    document.getElementById("ni_pool").value = "";
    document.getElementById("ni_qty").value = 0;
    document.getElementById("ni_price").value = "";
    document.getElementById("ni_g").value = 10;
    document.getElementById("ni_goal").value = "";
    document.getElementById("ni_band").value = 15;
    document.getElementById("ni_tranche").value = 1;
    applyPoolLimitDefaultsToNiForm("적립식");
    newModal.classList.remove("hidden");
  }
  Array.prototype.forEach.call(document.querySelectorAll("#modeSwitch button"), function(btn){
    btn.addEventListener("click", function(){
      state.viewMode = btn.getAttribute("data-mode");
      saveState();
      render();
    });
  });
  document.getElementById("newInstanceBtn").addEventListener("click", openNewInstanceModal);
  document.getElementById("ni_cancel").addEventListener("click", function(){ newModal.classList.add("hidden"); });
  document.getElementById("ni_type").addEventListener("change", function(){
    var t = this.value;
    document.getElementById("ni_g").value = TYPE_DEFAULTS[t].startG;
    applyPoolLimitDefaultsToNiForm(t);
  });
  document.getElementById("ni_create").addEventListener("click", function(){
    var name = document.getElementById("ni_name").value.trim();
    var type = document.getElementById("ni_type").value;
    var ticker = document.getElementById("ni_ticker").value.trim() || "TQQQ";
    var date = document.getElementById("ni_date").value;
    var cycleDays = parseInt(document.getElementById("ni_cycledays").value,10) || 14;
    var v = parseFloat(document.getElementById("ni_v").value);
    var pool = parseFloat(document.getElementById("ni_pool").value);
    var qty = parseFloat(document.getElementById("ni_qty").value) || 0;
    var price = parseFloat(document.getElementById("ni_price").value) || 0;
    var g = parseFloat(document.getElementById("ni_g").value) || TYPE_DEFAULTS[type].startG;
    var goal = parseFloat(document.getElementById("ni_goal").value);
    var bandPct = parseFloat(document.getElementById("ni_band").value) || 15;
    var trancheSize = parseInt(document.getElementById("ni_tranche").value, 10) || 1;
    var poolLimitConfig = {
      mode: document.getElementById("ni_pl_mode").value,
      basePct: parseFloat(document.getElementById("ni_pl_base").value) || 75,
      stepPct: parseFloat(document.getElementById("ni_pl_step").value) || 5,
      stepDays: parseFloat(document.getElementById("ni_pl_stepdays").value) || 182.5,
      floorPct: parseFloat(document.getElementById("ni_pl_floor").value) || 10,
      fixedPct: parseFloat(document.getElementById("ni_pl_fixed").value) || 10
    };
    if (!name || !date || isNaN(v) || isNaN(pool)){
      alert("이름, 시작일, 시작 V, 시작 Pool은 필수예요.");
      return;
    }
    var inst = {
      id: uid(), name: name, ticker: ticker, cycleDays: cycleDays,
      initDate: date, initV: v, initPool: pool, initQty: qty, initPrice: price,
      goalAmount: isNaN(goal) ? null : goal,
      band: { low: 1 - bandPct/100, high: 1 + bandPct/100 },
      typeSegments: [ { type: type, startDate: date, startG: g } ],
      poolLimitConfig: poolLimitConfig,
      trancheSize: trancheSize,
      cycles: []
    };
    state.instances.push(inst);
    state.selectedId = inst.id;
    saveState();
    newModal.classList.add("hidden");
    render();
  });

  var switchModal = document.getElementById("switchTypeModal");
  var switchTargetInst = null;
  function openSwitchTypeModal(inst){
    switchTargetInst = inst;
    var seg = currentSegment(inst, todayStr());
    var order = ["적립식","거치식","인출식"];
    var opts = order.filter(function(t){ return t !== seg.type; });
    var optsHost = document.getElementById("switchOptions");
    optsHost.innerHTML = opts.map(function(t, i){
      return '<label class="type-opt' + (i===0?" selected":"") + '"><span>' + t + '</span><input type="radio" name="swType" value="' + t + '" ' + (i===0?"checked":"") + ' /></label>';
    }).join("");
    Array.prototype.forEach.call(optsHost.querySelectorAll(".type-opt"), function(el){
      el.addEventListener("click", function(){
        Array.prototype.forEach.call(optsHost.querySelectorAll(".type-opt"), function(o){ o.classList.remove("selected"); });
        el.classList.add("selected");
        el.querySelector("input").checked = true;
        document.getElementById("sw_g").value = TYPE_DEFAULTS[el.querySelector("input").value].startG;
      });
    });
    document.getElementById("sw_date").value = todayStr();
    document.getElementById("sw_g").value = TYPE_DEFAULTS[opts[0]].startG;
    switchModal.classList.remove("hidden");
  }
  document.getElementById("sw_cancel").addEventListener("click", function(){ switchModal.classList.add("hidden"); });
  document.getElementById("sw_confirm").addEventListener("click", function(){
    var checked = document.querySelector('input[name="swType"]:checked');
    if (!checked) return;
    var date = document.getElementById("sw_date").value;
    var g = parseFloat(document.getElementById("sw_g").value) || TYPE_DEFAULTS[checked.value].startG;
    switchTargetInst.typeSegments.push({ type: checked.value, startDate: date, startG: g });
    switchTargetInst.typeSegments.sort(function(a,b){ return new Date(a.startDate)-new Date(b.startDate); });
    saveState();
    switchModal.classList.add("hidden");
    render();
  });

  var poolLimitModal = document.getElementById("poolLimitModal");
  var poolLimitTargetInst = null;
  function setPoolLimitMode(mode){
    Array.prototype.forEach.call(poolLimitModal.querySelectorAll(".type-opt"), function(el){
      var isMatch = el.querySelector("input").value === mode;
      el.classList.toggle("selected", isMatch);
      el.querySelector("input").checked = isMatch;
    });
    document.getElementById("plScheduleFields").classList.toggle("hidden", mode !== "schedule");
    document.getElementById("plFixedFields").classList.toggle("hidden", mode !== "fixed");
  }
  function openPoolLimitModal(inst){
    poolLimitTargetInst = inst;
    var seg = currentSegment(inst, todayStr());
    var cfg = inst.poolLimitConfig || defaultPoolLimitConfig(seg.type);
    document.getElementById("pl_base").value = cfg.basePct;
    document.getElementById("pl_step").value = cfg.stepPct;
    document.getElementById("pl_stepdays").value = cfg.stepDays;
    document.getElementById("pl_floor").value = cfg.floorPct;
    document.getElementById("pl_fixed").value = cfg.fixedPct;
    setPoolLimitMode(cfg.mode);
    poolLimitModal.classList.remove("hidden");
  }
  Array.prototype.forEach.call(poolLimitModal.querySelectorAll(".type-opt"), function(el){
    el.addEventListener("click", function(){ setPoolLimitMode(el.querySelector("input").value); });
  });
  document.getElementById("pl_cancel").addEventListener("click", function(){ poolLimitModal.classList.add("hidden"); });
  document.getElementById("pl_save").addEventListener("click", function(){
    var mode = document.querySelector('input[name="plMode"]:checked').value;
    poolLimitTargetInst.poolLimitConfig = {
      mode: mode,
      basePct: parseFloat(document.getElementById("pl_base").value) || 75,
      stepPct: parseFloat(document.getElementById("pl_step").value) || 5,
      stepDays: parseFloat(document.getElementById("pl_stepdays").value) || 182.5,
      floorPct: parseFloat(document.getElementById("pl_floor").value) || 10,
      fixedPct: parseFloat(document.getElementById("pl_fixed").value) || 10
    };
    saveState();
    poolLimitModal.classList.add("hidden");
    render();
  });

  /* ---------------- export / import ---------------- */
  document.getElementById("exportBtn").addEventListener("click", async function(){
    var data = JSON.stringify(state, null, 2);
    var filename = "vr-tracker-backup-" + todayStr() + ".json";
    try {
      var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
      if (downloads){
        await downloads.save({ filename: filename, data: data });
        return;
      }
    } catch(e){ /* fall through to manual */ }
    // fallback: open a blob link
    var blob = new Blob([data], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  });
  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed.instances) throw new Error("bad format");
        if (!confirm("현재 데이터를 불러온 백업으로 덮어쓸까요?")) return;
        state = parsed;
        saveState();
        render();
      } catch(e){
        alert("파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.");
      }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  /* ---------------- theme ---------------- */
  var themeBtn = document.getElementById("themeToggle");
  function applyThemeLabel(){
    var t = document.documentElement.getAttribute("data-theme");
    themeBtn.textContent = t === "dark" ? "다크" : (t === "light" ? "라이트" : "자동");
  }
  themeBtn.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : (cur === "light" ? null : "dark");
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    applyThemeLabel();
  });
  applyThemeLabel();

  /* ---------------- mobile drawer ---------------- */
  var sidebarEl = document.getElementById("sidebarEl");
  var sidebarBackdrop = document.getElementById("sidebarBackdrop");
  var hamburgerBtn = document.getElementById("hamburgerBtn");
  function openDrawer(){ sidebarEl.classList.add("open"); sidebarBackdrop.classList.add("open"); }
  function closeDrawer(){ sidebarEl.classList.remove("open"); sidebarBackdrop.classList.remove("open"); }
  hamburgerBtn.addEventListener("click", openDrawer);
  sidebarBackdrop.addEventListener("click", closeDrawer);
  sidebarEl.addEventListener("click", function(ev){
    // any tap that navigates away (pick a VR, switch mode, make a new VR) should close the drawer
    if (ev.target.closest(".instance-card, #modeSwitch button, #newInstanceBtn")) closeDrawer();
  });

  /* ---------------- init ---------------- */
  window.addEventListener("resize", function(){ if (currentUserId) render(); });
  wireAuthUI();
  if (sb){
    sb.auth.onAuthStateChange(function(_event, session){ onAuthChange(session); });
    sb.auth.getSession().then(function(res){ onAuthChange(res.data.session); });
  } else {
    setAuthMsg("연결에 문제가 있어요. 잠시 후 새로고침해주세요.", true);
  }
})();
</script>
